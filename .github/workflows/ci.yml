name: CI

on:
  push:
    branches: [main]
  pull_request:

# Determinism is a product guarantee (docs/SPEC.md §1), so the environment that
# checks it is pinned rather than floating. A build that passes only on the runner's
# current default is not evidence of anything.
env:
  TZ: UTC
  SOURCE_DATE_EPOCH: "315532800" # 1980-01-01, the ZIP epoch
  FORCE_COLOR: "1"

jobs:
  # Documentation and licensing run first and independently: they need no install,
  # they are fast, and an unlicensed fixture must be caught *before* any test can use
  # it (docs/CORPUS.md §1 rule 1).
  docs:
    name: Docs, schemas, and fixture licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cross-check the deliverables
        run: node scripts/check-docs.mjs

      - name: Enforce fixture licences
        run: node scripts/check-fixtures.mjs

      # No `version:` here on purpose. package.json pins pnpm via packageManager,
      # and action-setup@v4 fails outright when both are given.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      - name: Validate the JSON Schemas
        run: node scripts/check-schemas.mjs

  build:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 and 24, not 20. pnpm 11.9.0 - the version package.json pins - uses a
        # builtin module Node 20 does not have and dies with
        # ERR_UNKNOWN_BUILTIN_MODULE before install even starts, so the Node 20 entry
        # was never capable of passing. package.json's engines field now says >=22
        # too; claiming >=20.11 while the toolchain requires 22 was a false promise.
        node: [22, 24]
    steps:
      # fetch-depth: 0, because `check-gates.mjs` resolves the commit each gate cites as
      # evidence that it was seen to fail. The default shallow clone has one commit, so every
      # citation failed to resolve and the gate reported ten fabricated-looking references on
      # a repository where all ten are real. The gate was right to fail — it cannot verify a
      # citation it cannot reach — and the fix belongs here, in the environment, rather than
      # in a gate taught to skip the check when the history is thin.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No `version:` here on purpose. package.json pins pnpm via packageManager,
      # and action-setup@v4 fails outright when both are given.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Generated types must match the schemas. Running codegen and checking for a
      # diff catches the case where someone edits a schema and forgets to regenerate
      # — the compiler would still pass, and the mismatch would surface at runtime.
      # `git status --porcelain`, not `git diff --exit-code`.
      #
      # `git diff` cannot see an untracked file, so *newly generated* output — which is what
      # happens the first time a package acquires a schema — was invisible to this gate.
      # `packages/agentify/src/generated/target.ts` went uncommitted through a full green CI
      # run for exactly that reason. Modified output and new output are both staleness.
      - name: Generated types are up to date
        run: |
          pnpm run codegen
          drift=$(git status --porcelain -- 'packages/*/src/generated')
          if [ -n "$drift" ]; then
            echo "::error::Generated types are stale. Run 'pnpm codegen' and commit."
            echo "$drift"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # `apps/web` is outside the `tsc -b` project graph in tsconfig.json, because Next needs
      # `noEmit` and TypeScript rejects that alongside `composite`. It is held to the same
      # strict base regardless, so it typechecks here. This runs after Build because the app
      # imports `@markforge/*` through their `dist/` exports.
      - name: Typecheck the web app
        run: pnpm run typecheck:web

      # The messy DOCX corpus is committed rather than built on demand, so a test can
      # run without a build step. That trade only holds if the committed bytes still
      # match the generator — otherwise a fixture drifts and every assertion against
      # it silently measures something else.
      - name: Messy corpus fixtures are current
        run: node scripts/build-messy-fixtures.mjs --check

      # CORPUS §2.2, §2.5, and §2.12 — footnotes and OMML equations, merged and nested
      # tables, tracked changes from two authors. Committed rather than built on demand for
      # the same reason as the messy corpus. Authoring these found that the DOCX adapter
      # never read footnotes.xml: three references, no definitions, no diagnostic.
      - name: Manuscript, table, and revision fixtures are current
        run: node scripts/build-corpus-fixtures.mjs --check

      # The scanned corpus (CORPUS.md §2.7) matters more than the messy one for staleness:
      # the committed LLM cache is keyed on the *page image's digest*, so a rasteriser that
      # drifted by one pixel would miss every recorded vision response and look like a model
      # failure rather than a fixture change.
      - name: Scanned corpus fixtures are current
        run: node scripts/build-scanned-fixtures.mjs --check

      # ADR-0006: markdownlint runs check-only. A violation means the
      # remark-stringify configuration has drifted from the rule set, not that the
      # output needs patching — there is no autofix pass to patch it with.
      - name: Rendered Markdown satisfies the lint rule set
        run: node scripts/check-markdown-lint.mjs

      # ADR-0005 builds our own OOXML reader instead of using Mammoth. This keeps the
      # resulting risk reviewed: every divergence between the two readers must be
      # triaged in docs/MAMMOTH-DIFF.md, and an untriaged one fails here.
      - name: OOXML reader differential against Mammoth
        run: node scripts/diff-mammoth.mjs --check

      # The agentify source sets, and the gate on their own premise: the near-duplicate
      # pairs must stay lexically dissimilar, or they stop justifying SPEC §10.4's use of
      # embeddings over a text threshold.
      - name: Agentify corpus fixtures are current
        run: node scripts/build-agentify-corpus.mjs --check

      # The three reference templates of TEMPLATES.md §2. Committed rather than built on
      # demand for the same reason the messy corpus is, and gated the same way — plus the
      # §2.1 inventory itself, including the zero-direct-formatting rule, which is the
      # property that makes them an argument rather than just a file.
      - name: Reference templates are current and satisfy TEMPLATES.md §2.1
        run: node scripts/build-reference-templates.mjs --check

      # A shipped template that stops defining the full Pandoc set is a regression
      # (TEMPLATES.md §2.2). This is also the only end-to-end exercise of `check
      # --reference-doc` on a file we control.
      - name: Every reference template defines all 38 Pandoc style names
        run: |
          set -e
          for f in templates/*.docx; do
            # 2>&1 matters: `--json` is absent, so human output goes to stderr by design
            # (SPEC §8 keeps stdout machine-readable). Capturing stdout alone made $out
            # empty and the grep below matched nothing, so this step passed while checking
            # nothing — caught on its first CI run, which is the argument for running it.
            out=$(node packages/cli/dist/index.js check --reference-doc "$f" 2>&1)
            echo "$out" | head -1
            echo "$out" | grep -q "38 of 38 Pandoc names defined"               || (echo "::error::$f does not define all 38 Pandoc style names" && exit 1)
          done

      # The templates carry constructs the writer cannot yet produce — OMML, footnotes,
      # embedded images, cross-references — so parsing them is a real test of the reader.
      # It is also the regression guard for a defect they exposed: IR validation used to
      # take longer than two minutes on a 183-node document with tables, so `check` hung.
      - name: Reference templates parse, validate, and do so quickly
        run: |
          set -e
          start=$(date +%s)
          node packages/cli/dist/index.js check templates/*.docx
          elapsed=$(( $(date +%s) - start ))
          test "$elapsed" -lt 30             || (echo "::error::validating three templates took ${elapsed}s; IR validation has regressed" && exit 1)
          echo "Three reference templates parsed and validated in ${elapsed}s."

      # The agentify measurements, and the negative control that makes them mean something.
      # Runs after the build because it imports the built packages.
      - name: Agentify gates and answer-key measurements
        run: node scripts/check-agentify.mjs

      - name: docs/AGENTIFY.md is current
        run: |
          git diff --exit-code -- docs/AGENTIFY.md \
            || (echo "::error::docs/AGENTIFY.md is stale. Run 'node scripts/check-agentify.mjs --update' and commit." && exit 1)

      # ADR-0015, built rather than asserted. The decision sat at `Proposed` for four
      # phases and was wrong for all ten packages it named; this is what keeps it true.
      # A `node:` import added to any package in the eager set fails here, which is the
      # only moment that regression is cheap to fix.
      - name: The browser build has no Node dependency (ADR-0015)
        run: node scripts/check-browser-bundle.mjs

      # SPEC §8's "stateless, no document retention" is a privacy claim, so it is
      # measured here rather than asserted in a README — filesystem delta, retrieval
      # routes, minted ids, and cross-request contamination, each against a deliberately
      # retaining control that all four probes must catch.
      - name: The HTTP API retains no document (SPEC §8)
        run: node scripts/check-http-retention.mjs

      # SPEC §1.3: every degradation carries a diagnostic. That was an invariant nobody
      # could check, and one instance means it was never held. Every catch block now
      # declares what it does with the failure, and an unannotated one fails here.
      - name: Every degrading path is classified at its site (SPEC §1.3)
        run: node scripts/check-degradation.mjs

      # CORPUS §2.14.1's merge predicate, applied to every pair a corpus key claims
      # something about. This is what makes "are these one fact" decidable rather than a
      # matter of opinion between a fixture comment and a model.
      - name: The merge predicate agrees with the corpus keys (CORPUS §2.14.1)
        run: node scripts/check-merge-predicate.mjs

      # §2.16's three graded cases were all worked examples inside the prompt that grades
      # them, so its 1/1 recall and 0/2 false merges measured the prompt reciting itself.
      # The rule that retired them was prose; this is the rule as a gate.
      - name: No graded fixture appears in a prompt that grades it (CORPUS §2.17)
        run: node scripts/check-fixture-contamination.mjs

      # 611 tests here, 606 on a clean clone: 7 reported skipped and 5 that left the total
      # unannounced. A suite that reports its own completeness is the defect this phase is about.
      - name: Every test file is collected and every skip is declared
        run: node scripts/check-test-collection.mjs

      # ADR-0015 sat Accepted while wrong for all ten packages it named, because
      # acceptance never had a check attached. Every ADR now names one.
      - name: Every ADR names the check that enforces it
        run: node scripts/check-adr-enforcement.mjs

      # The closing property: a claim with neither a check nor an unverified marker is a
      # defect regardless of whether it happens to be true.
      - name: STATUS.md carries no unmarked unchecked claim
        run: node scripts/check-status-claims.mjs

      # A note about data must not live where the data cannot contradict it.
      - name: docs/TARGETS.md is derived from targets/*.json
        run: node scripts/check-target-docs.mjs

      # `pnpm verify` is a proxy for this workflow, and the two diverged twice. The
      # agentify assertion is the instance everyone remembers — one stale claim in two
      # places, fixed in the script and not in the workflow, local green and CI red for the
      # same commit. This gate is the shape rather than the instance. On its first run it
      # found two more: build-scanned-fixtures and run-fidelity both gated the branch and
      # neither was in the local chain.
      - name: pnpm verify and ci.yml run the same gates
        run: node scripts/check-gate-parity.mjs

      # docs/GATES.md is the audit the Phase 6 brief asked for: one row per gate, what it
      # asserts, where it was seen to fail, and which side runs it. Generated, because a list
      # nobody generates goes stale the first time a gate is added. Producing it found ten
      # gates that could not fail at all — each reporting success in a way an empty input
      # would report identically.
      - name: docs/GATES.md is current and every gate can fail
        run: node scripts/check-gates.mjs

      # The census's blind spot, closed. docs/FIDELITY.md diffs input IR against
      # round-tripped IR, so a node type no adapter ever produces is absent from both sides
      # and scores as agreement. Its first run found four: equationBlock, comment, citation,
      # and textBox — the last two named in SPEC §3.1 as extracted, with no code anywhere.
      - name: Every IR node type has a producer and a consumer
        run: node scripts/check-node-type-coverage.mjs

      # The second measurement blind spot. A round trip applies the same code to both sides,
      # so a symmetric defect agrees with itself: tables-block-content scored 100% on every
      # metric while textContent joined a cell's paragraphs with nothing. This compares parsed
      # IR against a hand-written declaration, which is the only asymmetric side available.
      - name: Parsed IR matches its authored declaration
        run: node scripts/check-ir-structure.mjs

      # SPEC §4.1's seven flavour presets, which were config-schema values read by nothing
      # until 2026-08-01. The gate is distinctness rather than coverage: seven presets must
      # produce seven byte-distinct renders of one construct-dense document, so a preset that
      # ties with another is struck rather than implying a difference that does not exist.
      # It also carries the only no-silent-loss check against a target that genuinely cannot
      # hold a construct — CommonMark has no footnote syntax.
      - name: Seven flavour presets render seven distinct documents
        run: node scripts/check-flavor-distinctness.mjs

      # ADR-0003, built 2026-08-01 after four phases in which check-browser-bundle.mjs
      # reported render-pdf as absent on every run. The property this holds is determinism,
      # because that is the part that depends on how we call Typst rather than on Typst:
      # two compiles in separate processes differed at byte 11533 in /CreationDate until
      # `#set document(date: none)` removed the field. A same-process check would have
      # passed throughout and proved nothing.
      - name: PDF output is byte-identical across processes (ADR-0003)
        run: node scripts/check-pdf-determinism.mjs

      # The determinism gate above compares two processes on ONE machine, so it is
      # structurally blind to output that depends on which fonts are installed. It was:
      # unicode-edge-cases.pdf embedded SimSun, ArialMT and SegoeUIEmoji from a Windows box,
      # and CI — with none of those present — produced different bytes and passed. This is the
      # check that sees it, and the reason it matters most in CI is that the runner's font set
      # is not the developer's.
      - name: Every embedded PDF font is one we ship (SPEC §4.3)
        run: node scripts/check-pdf-fonts.mjs

      # SPEC §8 lists a pre-commit hook alongside the GitHub Action. Shipping the script
      # would not have been the feature: a hook nobody runs is discovered broken by the first
      # contributor who installs it. This drives it through five commits in a throwaway
      # repository, including the case that separates a hook reading the index from one
      # reading the working tree, and a control that removes the hook to prove the rejection
      # came from it.
      - name: The pre-commit hook works, on a real repository
        run: node scripts/check-hook.mjs

      # The shipped templates under --strict, and one document that must exit 0.
      #
      # This was six lines of inline shell, and that is how it reached main red: gate parity
      # compares the set of gate *scripts* on each side, and an inline `run:` step is not a
      # script — so the assertion lived on exactly one of the two sides, which is the
      # divergence that gate exists to prevent, in a shape it could not see. It is a file now,
      # and `pnpm verify` runs it.
      - name: The shipped templates report their losses under --strict
        run: node scripts/check-template-strict.mjs

      # Surface parity. The same input through the CLI, the HTTP API, the MCP
      # server, and the browser build must produce identical bytes — this is what makes
      # four surfaces one engine rather than four converters, and a wrapper that trimmed a
      # newline would pass every unit test in its own package and fail only here.
      # MODEL_API_KEY is unset, so a surface reaching the network fails rather than
      # quietly succeeding.
      - name: Four surfaces, same input, same bytes
        run: node scripts/check-surface-parity.mjs
        env:
          MODEL_API_KEY: ""

      - name: Test
        run: pnpm run test

  fidelity:
    name: Fidelity baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `version:` here on purpose. package.json pins pnpm via packageManager,
      # and action-setup@v4 fails outright when both are given.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The tesseract row of the scanned subset needs eng.traineddata, and the found
      # scan of CORPUS.md §2.7 needs downloading — both are gitignored under §4's size
      # rule. Without them the harness measures a *smaller* set than the committed
      # baselines describe and regenerates a FIDELITY.md missing the OCR row, which the
      # staleness check below would then report as a stale document. Fetching here keeps
      # CI measuring exactly what the committed numbers claim.
      - name: Fetch OCR language data and the found scan
        run: node scripts/fetch-ocr-assets.mjs

      # Exit 4 is the fidelity-regression code from SPEC §8. A drop beyond tolerance
      # fails the build; an unexplained *improvement* is reported but does not, since
      # it needs a human to confirm the metric did not simply break.
      - name: Measure against committed baselines
        run: node scripts/run-fidelity.mjs --check

      # FIDELITY.md is generated, so a stale one in the repo is a lie about measured
      # performance. Regenerating and diffing is the cheapest way to keep it honest.
      - name: docs/FIDELITY.md is current
        run: |
          git diff --exit-code -- docs/FIDELITY.md \
            || (echo "::error::docs/FIDELITY.md is stale. Run 'pnpm fidelity --update' and commit." && exit 1)

  scoreboard:
    name: Scoreboard against Pandoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `version:` here on purpose. package.json pins pnpm via packageManager,
      # and action-setup@v4 fails outright when both are given.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Pinned, not apt's floating version. docs/SCOREBOARD.md records which pandoc
      # produced it, and the staleness gate below byte-compares that file — so an
      # unpinned competitor would make our own numbers look like they had changed
      # every time Ubuntu bumped a package. Keep PANDOC_VERSION and the "Competitor:"
      # line in docs/SCOREBOARD.md in step.
      - name: Install pandoc (pinned)
        env:
          PANDOC_VERSION: "3.10"
        run: |
          set -euo pipefail
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -fsSLO "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${deb}"
          sudo dpkg -i "$deb"
          pandoc --version | head -1

      # CORPUS.md §2.15's third producer profile, and it lives in *this* job because this is
      # the job with the pinned binary. Generated rather than committed: a Pandoc DOCX carries
      # Pandoc's GPL reference styles, and fixtures/LICENSES.md exists to keep that out of the
      # repository. Its first run found the schema capping `outlineLevel` at 8 while
      # ISO/IEC 29500-1 allows 0-9, so every Pandoc-produced document parsed to an invalid IR
      # with no diagnostic at all.
      - name: A real Pandoc export parses into a valid IR (CORPUS §2.15)
        run: node scripts/check-producer-exports.mjs

      # Guards the metrics where the two tools tie today. Does not assert a win on
      # structural, because there is not one — see docs/SCOREBOARD.md.
      - name: Compare against Pandoc
        run: node scripts/run-scoreboard.mjs --check

      - name: docs/SCOREBOARD.md is current
        run: |
          git diff --exit-code -- docs/SCOREBOARD.md             || (echo "::error::docs/SCOREBOARD.md is stale. Run the scoreboard and commit." && exit 1)

  determinism:
    name: Byte-identical output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `version:` here on purpose. package.json pins pnpm via packageManager,
      # and action-setup@v4 fails outright when both are given.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The guarantee in SPEC §1, checked rather than asserted. Converting the same
      # input twice — in different timezones — must produce identical bytes. The
      # timezone half matters because ZIP stores timestamps from local-time fields,
      # which is exactly how this broke once already.
      - name: Same input, same bytes, different timezone
        run: |
          set -e
          TZ=UTC node packages/cli/dist/index.js convert fixtures/md/clean-report.md -o /tmp/a.docx --quiet
          TZ=Pacific/Kiritimati node packages/cli/dist/index.js convert fixtures/md/clean-report.md -o /tmp/b.docx --quiet
          TZ=America/New_York node packages/cli/dist/index.js convert fixtures/md/clean-report.md -o /tmp/c.docx --quiet
          cmp /tmp/a.docx /tmp/b.docx || (echo "::error::DOCX output differs across timezones" && exit 1)
          cmp /tmp/a.docx /tmp/c.docx || (echo "::error::DOCX output differs across timezones" && exit 1)
          echo "DOCX output is byte-identical across three timezones."

      # Every readable format must survive a conversion. This catches an adapter that
      # throws on real input, which unit tests using synthetic fixtures can miss.
      - name: All input formats convert
        run: |
          set -e
          for f in fixtures/md/*.md; do
            node packages/cli/dist/index.js convert "$f" -o /tmp/out.html --quiet
            node packages/cli/dist/index.js convert "$f" -o /tmp/out.docx --quiet
          done
          for f in fixtures/html/*.html; do
            node packages/cli/dist/index.js convert "$f" -o /tmp/out.md --quiet
            node packages/cli/dist/index.js convert "$f" -o /tmp/out.docx --quiet
          done
          echo "Every corpus fixture converts to every output format."

      # An input-only format must refuse by name rather than fail somewhere internal.
      - name: Input-only formats refuse clearly
        run: |
          set +e
          out=$(node packages/cli/dist/index.js convert fixtures/md/clean-report.md -o /tmp/x.xlsx 2>&1)
          code=$?
          set -e
          echo "$out" | grep -q "input format only" || (echo "::error::--to xlsx did not refuse by name" && exit 1)
          test "$code" -eq 1 || (echo "::error::--to xlsx exited $code, expected 1" && exit 1)
          echo "Input-only formats refuse with exit 1 and a named reason."

          # PDF was in the list above until 2026-08-02, asserting that `--to pdf` refuses.
          # It no longer does, so the arm is inverted rather than deleted: deleting it would
          # halve a control that still holds for xlsx, and would stop anyone noticing if PDF
          # output regressed back into a refusal.
          node packages/cli/dist/index.js convert fixtures/md/clean-report.md -o /tmp/x.pdf
          test -s /tmp/x.pdf || (echo "::error::--to pdf produced no file" && exit 1)
          head -c 5 /tmp/x.pdf | grep -q '%PDF-' \
            || (echo "::error::--to pdf did not produce a PDF header" && exit 1)

          # DOCX and HTML input too, and not for symmetry's sake.
          #
          # The `#figure(` defect — markup handed to a code-context argument, which made Typst
          # abort with a bare `Error` and the CLI print `markforge: ` and nothing — was
          # reachable only from HTML, because no Markdown fixture has a figure. A Markdown-only
          # smoke would have stayed green through all of it. Each input format reaches
          # constructs the others do not, so each gets a line.
          for pair in "fixtures/html/semantic-structure.html:/tmp/h.pdf" \
                      "fixtures/docx/messy-combined.docx:/tmp/d.pdf"; do
            src="${pair%%:*}"; dst="${pair##*:}"
            node packages/cli/dist/index.js convert "$src" -o "$dst" --quiet
            test -s "$dst" || (echo "::error::$src -> pdf produced no file" && exit 1)
            head -c 5 "$dst" | grep -q '%PDF-' \
              || (echo "::error::$src -> pdf did not produce a PDF header" && exit 1)
          done
          echo "PDF output writes a real PDF from Markdown, HTML, and DOCX."

      # Reproducibility, both halves: `--no-llm` and a cached-LLM run must both be
      # byte-reproducible. The LLM half runs with **no API key in the environment at all** and
      # `--llm-cache-mode readOnly`, which is what makes it a real check rather than a rehearsal
      # — if anything on this path reached the network it would fail here, not silently succeed.
      - name: Cached-LLM runs are byte-reproducible, and offline
        run: |
          set -e
          unset MODEL_API_KEY
          node packages/cli/dist/index.js convert fixtures/pdf/scanned-150dpi.pdf \
            -o /tmp/scan-a.md --llm --llm-cache-mode readOnly --quiet
          node packages/cli/dist/index.js convert fixtures/pdf/scanned-150dpi.pdf \
            -o /tmp/scan-b.md --llm --llm-cache-mode readOnly --quiet
          cmp /tmp/scan-a.md /tmp/scan-b.md \
            || (echo "::error::two cached-LLM runs of the same scan differ" && exit 1)
          node packages/cli/dist/index.js convert fixtures/docx/messy-ambiguous-headings.docx \
            -o /tmp/amb-a.md --llm --llm-cache-mode readOnly --quiet
          node packages/cli/dist/index.js convert fixtures/docx/messy-ambiguous-headings.docx \
            -o /tmp/amb-b.md --llm --llm-cache-mode readOnly --quiet
          cmp /tmp/amb-a.md /tmp/amb-b.md \
            || (echo "::error::two cached-LLM tie-break runs differ" && exit 1)
          echo "Cached-LLM output is byte-identical across runs, with no key present."

      # The other half: the LLM must *change* something, or the measurement is vacuous. A
      # cached tie-break demotes one bold lead-in sentence that the deterministic path promotes,
      # so the two outputs must differ — and if they ever stop differing, the ambiguous subset
      # has stopped testing anything.
      - name: The LLM path differs from the deterministic one, and only where it should
        run: |
          set -e
          unset MODEL_API_KEY
          node packages/cli/dist/index.js convert fixtures/docx/messy-ambiguous-headings.docx \
            -o /tmp/amb-nollm.md --quiet
          node packages/cli/dist/index.js convert fixtures/docx/messy-ambiguous-headings.docx \
            -o /tmp/amb-llm.md --llm --llm-cache-mode readOnly --quiet
          if cmp -s /tmp/amb-nollm.md /tmp/amb-llm.md; then
            echo "::error::--llm produced the same document as --no-llm on the ambiguous subset;"
            echo "::error::either the cache is missing or the fixture stopped being ambiguous"
            exit 1
          fi
          diff /tmp/amb-nollm.md /tmp/amb-llm.md || true
          echo "The tie-break changed the document, as the committed cache says it should."

      # A scan with neither route must refuse by name rather than write an empty file.
      - name: A scan refuses without a recogniser
        run: |
          set +e
          out=$(node packages/cli/dist/index.js convert fixtures/pdf/scanned-150dpi.pdf -o /tmp/x.md 2>&1)
          code=$?
          set -e
          echo "$out" | grep -q "no text layer" || (echo "::error::a scan did not refuse by name" && exit 1)
          test "$code" -eq 1 || (echo "::error::a scan exited $code, expected 1" && exit 1)
          echo "A scan with no recogniser refuses with exit 1 and names both routes."

      # The agentify criterion, both halves, through the shipped CLI rather than the
      # library — so a broken command-line surface fails here rather than passing a unit
      # test. No API key is set: agentify's default is --no-llm and the gate must clear
      # without a model, or the deterministic path is not really the default.
      - name: A folder of mixed documents compiles to a CLAUDE.md set that passes the gate
        run: |
          set -e
          unset MODEL_API_KEY
          rm -rf /tmp/agentify-out
          node packages/cli/dist/index.js agentify fixtures/agentify/clean \
            --targets agents-md,claude-md,claude-skills,claude-commands,mcp-manifest \
            --out-dir /tmp/agentify-out \
            --manifest /tmp/agentify-out/.markforge/provenance.json
          test -f /tmp/agentify-out/CLAUDE.md \
            || (echo "::error::no CLAUDE.md was produced" && exit 1)
          test -f /tmp/agentify-out/.markforge/provenance.json \
            || (echo "::error::no provenance manifest was written" && exit 1)
          echo "A CLAUDE.md set was produced from md + html + docx and passed the gate."

      # Budget loss is visible and non-zero under --strict.
      #
      # This step originally claimed an over-budget run exits 5, and running it showed that
      # was wrong twice over: exit 5 is the *traceability* code, and nothing was being
      # dropped at all because the overflow route absorbed it. What is true is narrower and
      # worth checking — a target with no secondary route drops its lowest-value units,
      # names every one under --explain-drops, and exits 2 under --strict.
      #
      # The gate's ability to *fail* is checked at library level by
      # scripts/check-agentify.mjs (three crafted violations) rather than here, because by
      # construction the CLI cannot assemble an untraceable file: exit 5 is reachable only
      # through a defect, which is the point.
      - name: Budget loss is reported and exits 2 under --strict
        run: |
          set +e
          unset MODEL_API_KEY
          out=$(node packages/cli/dist/index.js agentify fixtures/agentify/clean \
            --targets claude-commands --budget 30 --dry-run --strict --explain-drops 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 2 \
            || (echo "::error::a lossy agentify run under --strict exited $code, expected 2" && exit 1)
          echo "$out" | grep -q "dropped \[budget\]" \
            || (echo "::error::--explain-drops named no dropped unit" && exit 1)
          echo "$out" | grep -q "MF-AGENT-0006" \
            || (echo "::error::dropping a unit emitted no lossy diagnostic" && exit 1)
          echo "Budget loss is named unit by unit and exits 2 under --strict."

      # Two runs, byte-identical. Determinism is a product guarantee (SPEC §1) and Surface A
      # is not exempt: an agent file that churns on every run is unusable in a repository,
      # which is the whole point of SPEC §10.8.
      - name: Agentify output is byte-identical across runs
        run: |
          set -e
          unset MODEL_API_KEY
          for run in a b; do
            node packages/cli/dist/index.js agentify fixtures/agentify/clean \
              --targets claude-md,agents-md --out-dir "/tmp/ag-$run" \
              --manifest "/tmp/ag-$run/.markforge/provenance.json" --quiet
          done
          diff -r /tmp/ag-a /tmp/ag-b \
            || (echo "::error::two agentify runs of the same input differ" && exit 1)
          echo "Agentify output and its provenance manifest are byte-identical across runs."

      # The agentify LLM half, with the same two properties required of the conversion path:
      # reproducible offline, and *different* from the deterministic path. The second matters
      # more — a cached run that matched --no-llm exactly would mean the model changed nothing
      # and the measurement was vacuous. Here the difference is one merged near-duplicate.
      # Runs on `fixtures/agentify/dedup` (CORPUS §2.17), not on the clean set.
      #
      # It used to run on `clean` and assert that `--llm` differed from `--no-llm` there,
      # which held because of a sentence-split merge. Adjudicator prompt v2 correctly
      # declines that merge — it drops `partial` and `never`, which §2.14.1 counts as scope
      # — so the clean set now merges nothing and this job failed for the *correct*
      # behaviour. §2.17 is the set where a merge still happens, and the diff is
      # exactly one line.
      #
      # The same stale assertion existed in check-agentify.mjs and was fixed there; this
      # copy was missed because `pnpm verify` does not run ci.yml. Two places asserting one
      # thing is how one of them goes stale unnoticed.
      - name: Cached-LLM agentify is byte-reproducible offline and the cached path is live
        run: |
          set -e
          unset MODEL_API_KEY
          for run in a b; do
            node packages/cli/dist/index.js agentify fixtures/agentify/dedup               --targets claude-md --llm --llm-cache-mode readOnly --dedup-adjudicate               --out-dir "/tmp/agl-$run" --manifest "/tmp/agl-$run/p.json" --quiet
          done
          diff -r /tmp/agl-a /tmp/agl-b             || (echo "::error::two cached-LLM agentify runs differ" && exit 1)
          node packages/cli/dist/index.js agentify fixtures/agentify/dedup             --targets claude-md --out-dir /tmp/agl-det --manifest /tmp/agl-det/p.json --quiet
          # What --llm changes is asserted against a committed file by
          # `scripts/check-agentify.mjs` check 8, which this workflow already runs. It is NOT
          # asserted here as "the outputs differ", and that wording is gone on purpose.
          #
          # Three jobs in a row asserted a difference existed and went green on a merge nobody
          # had inspected — the last of which deleted "A sealed document must never be
          # re-issued under the same reference". Since CORPUS §2.14.1 became a veto in
          # `dedup.ts`, the assisted and deterministic outputs on this set are **byte-identical**,
          # because the veto blocks the one merge the adjudicator proposes. Asserting a
          # difference would now fail for the correct behaviour, for the third time.
          #
          # What this job still owns is that the cached path is *live and reproducible*: two
          # readOnly runs with no key agree, and the run report shows calls were made and
          # answered from cache rather than skipped.
          calls=$(node packages/cli/dist/index.js agentify fixtures/agentify/dedup             --targets claude-md --llm --llm-cache-mode readOnly --dedup-adjudicate --out-dir /tmp/agl-j             --json --quiet | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j.llm?.calls ?? 0))})')
          test "$calls" -gt 0             || (echo "::error::the cached-LLM run made 0 model calls, so this job exercised the deterministic path twice" && exit 1)
          diff /tmp/agl-det/CLAUDE.md /tmp/agl-a/CLAUDE.md || true
          echo "Cached-LLM agentify is reproducible offline; $calls call(s) served from the committed cache."

      # fmt --check on already-formatted files must exit 0. If it did not, the
      # formatter would report its own output as needing formatting.
      - name: fmt is a fixed point on the corpus
        run: |
          set -e
          node packages/cli/dist/index.js fmt fixtures/md/*.md --quiet
          git diff --exit-code -- fixtures/md \
            || (echo "::error::fmt changed the corpus; commit the formatted files" && exit 1)
          node packages/cli/dist/index.js fmt fixtures/md/*.md --check --quiet
          echo "fmt reaches a fixed point on every corpus fixture."

      # The GitHub Action, consumed by the repository that ships it.
      #
      # Its gate is not that `action.yml` exists — that would be a file, not a check.
      # Dogfooding is the measurement: if the action's inputs, its exit-code mapping, or
      # the path it builds the CLI at ever break, this step goes red in the same run that
      # broke them, rather than in some other repository weeks later.
      #
      # `uses: ./` runs the action from this checkout, so it exercises the working tree
      # rather than a tagged ref.
      - name: The shipped GitHub Action gates this repository (dogfood)
        uses: ./
        with:
          command: fmt
          paths: fixtures/md/clean-report.md fixtures/md/tables.md fixtures/md/inline-marks.md

      # And the other half: the action must be able to *fail*. A dogfood step that only
      # ever passes proves the action runs, not that it gates. This points it at a file
      # deliberately left unformatted and asserts exit 3, the SPEC §8 code for
      # "fmt --check found files needing changes".
      - name: The Action reports a file that needs formatting (negative control)
        run: |
          set +e
          mkdir -p /tmp/action-control
          printf '#  Badly   spaced\n\n\n\ntext\n' > /tmp/action-control/bad.md
          MODEL_API_KEY="" node packages/cli/dist/index.js fmt /tmp/action-control/bad.md --check --quiet
          code=$?
          set -e
          test "$code" -eq 3 || (echo "::error::expected exit 3 for a file needing formatting, got $code" && exit 1)
          echo "The Action's failure path returns exit 3 as SPEC §8 specifies."

  # SPEC §9: "A separate, non-blocking live job detects model drift." Non-blocking is the
  # whole design — it calls a real gateway, so it can fail for reasons that have nothing to do
  # with this repository, and a required check that goes red when someone else's server is busy
  # trains people to ignore red.
  #
  # It answers one question the committed cache cannot: are the recorded responses still what
  # the models produce? A cached run stays green forever by construction, which is what makes it
  # a test — and also what makes it blind to a model that has changed its mind.
  llm-drift:
    name: Live model drift (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Never on a pull request: a fork's PR cannot see the secret, and a job that always fails
    # for outside contributors is worse than no job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Skips itself, loudly, when the secret is absent — rather than failing and looking like
      # drift. "The check did not run" and "the models changed" must not look the same.
      - name: Probe the endpoint and compare against the committed cache
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          set -e
          if [ -z "${MODEL_API_KEY:-}" ]; then
            echo "::notice::MODEL_API_KEY is not configured, so live drift was not measured."
            exit 0
          fi
          node packages/cli/dist/index.js check --llm

          # A fresh cache directory, so every call is live. The committed cache is untouched:
          # this job reports drift, it does not re-record it. Re-recording is a human decision
          # because it changes committed measurements.
          node packages/cli/dist/index.js convert fixtures/docx/messy-ambiguous-headings.docx \
            -o /tmp/amb-live.md --llm --llm-cache-dir /tmp/live-cache --quiet
          node packages/cli/dist/index.js convert fixtures/docx/messy-ambiguous-headings.docx \
            -o /tmp/amb-cached.md --llm --llm-cache-mode readOnly --quiet
          if cmp -s /tmp/amb-live.md /tmp/amb-cached.md; then
            echo "::notice::No drift: live answers match the committed cache."
          else
            echo "::warning::Model drift detected on the ambiguous subset."
            diff /tmp/amb-cached.md /tmp/amb-live.md || true
            echo "::warning::Re-record with --llm-cache-mode readWrite and commit if the new answers are better."
          fi
