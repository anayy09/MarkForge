packages:
  - "packages/*"
# esbuild is the only dependency permitted to run an install script: it is a
# dev-only transitive dependency of vitest and needs its postinstall to place its
# platform binary. Deliberately a list of one — an install script is arbitrary code
# execution at `pnpm install` time, so each entry should be a decision rather than
# a default.
#
# tesseract.js is the second entry and is a *denial*, which is why the list is still
# a list of one permission. Its postinstall is `opencollective-postinstall || true`,
# which prints a donation notice and nothing else: the package works without it, so
# there is no reason to run a script we do not need. Recorded here rather than left
# unset so a future `pnpm install` does not stop to ask again (ADR-0017).
allowBuilds:
  esbuild: true
  tesseract.js: false
minimumReleaseAgeExclude:
  - word-to-markdown@0.3.0

# The package list follows docs/SPEC.md §11. A package is added when there is code to put
# in it, not before: `agentify` held only `schema/target.v0.schema.json` until it had code
# to put beside it, which is the rule this comment records rather than an accident of
# ordering.
#
# `render-pdf` is still deliberately not scaffolded: it needs
# the Typst WASM bundle (ADR-0003), and an empty package is a promise made
# without need. ADR-0015's lazy tier is therefore ratified for two of its three
# members, which the browser-bundle gate reports on every run rather than glossing.
