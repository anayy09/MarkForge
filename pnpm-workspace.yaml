packages:
  - "packages/*"
  # `apps/*` holds things that *use* the packages rather than compose them. There is one,
  # `apps/web`, and it is deliberately outside the `tsc -b` project graph in tsconfig.json:
  # Next needs `noEmit` and `moduleResolution: "bundler"`, and `noEmit` is illegal in a
  # composite project. It typechecks itself, which `verify` and CI both run.
  - "apps/*"
# esbuild is the only dependency permitted to run an install script: it is a
# dev-only transitive dependency of vitest and needs its postinstall to place its
# platform binary. Deliberately a list of one — an install script is arbitrary code
# execution at `pnpm install` time, so each entry should be a decision rather than
# a default.
#
# tesseract.js is the second entry and is a *denial*, which is why the list is still
# a list of one permission. Its postinstall is `opencollective-postinstall || true`,
# which prints a donation notice and nothing else: the package works without it, so
# there is no reason to run a script we do not need. Recorded here rather than left
# unset so a future `pnpm install` does not stop to ask again (ADR-0017).
# sharp is the third entry and is the second *denial*. Next pulls it as an optional
# dependency for `next/image` optimisation. `apps/web` ships no photography: its visual
# material is the artifacts the engine produces, so `images.unoptimized` is set in
# apps/web/next.config.ts and nothing calls the optimiser. Denying it keeps a native
# binary and its install script out of the tree for a code path that does not exist.
allowBuilds:
  esbuild: true
  sharp: false
  tesseract.js: false
minimumReleaseAgeExclude:
  - word-to-markdown@0.3.0

# The package list follows docs/SPEC.md §11. A package is added when there is code to put
# in it, not before: `agentify` held only `schema/target.v0.schema.json` until it had code
# to put beside it, which is the rule this comment records rather than an accident of
# ordering.
#
# `render-pdf` was built 2026-08-01 and reached the shipped surfaces 2026-08-02, so this
# comment's former claim that it "is still deliberately not scaffolded" is retired.
# `typst-node` joined it as the Node binding; the browser reaches Typst through a
# caller-supplied WASM compiler behind the `@markforge/browser/pdf` entry point, which is why
# neither artifact appears in the eager bundle.
